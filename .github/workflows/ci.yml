name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and PostgreSQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: dms
          POSTGRES_USER: dms
          POSTGRES_PASSWORD: ci-only-database-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U dms -d dms"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      TEST_POSTGRES: "1"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PASSWORD: ci-only-database-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Static quality and migrations
        run: |
          ruff check .
          ruff format --check .
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Contract, concurrency and PostgreSQL search tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - name: Validate published OpenAPI contract
        run: |
          python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
          diff -u docs/openapi.yaml /tmp/openapi.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  compose:
    name: Real Compose acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable secrets
        run: python scripts/init_env.py
      - name: Validate and build
        run: |
          docker compose config --quiet
          docker compose --profile test build
      - name: Export and reload the MinIO image
        run: |
          python scripts/minio_image.py export --directory "$RUNNER_TEMP/minio-image" --revision "$GITHUB_SHA"
          docker image rm mini-dms-minio:2025-10-15
          python scripts/minio_image.py load --directory "$RUNNER_TEMP/minio-image"
      - name: Start services
        run: docker compose up --no-build -d --wait --wait-timeout 180
      - name: Create evaluation administrator
        env:
          DJANGO_SUPERUSER_USERNAME: ci-admin
          DJANGO_SUPERUSER_EMAIL: ci@example.invalid
          DJANGO_SUPERUSER_PASSWORD: ephemeral-ci-admin-passphrase-5739
        run: docker compose run --rm -e DJANGO_SUPERUSER_USERNAME -e DJANGO_SUPERUSER_EMAIL -e DJANGO_SUPERUSER_PASSWORD api python manage.py createsuperuser --noinput
      - name: Containerized PostgreSQL test suite
        run: docker compose --profile test run --rm test pytest --cov --cov-fail-under=90
      - name: Full-stack smoke test
        env:
          SMOKE_USERNAME: ci-admin
          SMOKE_PASSWORD: ephemeral-ci-admin-passphrase-5739
        run: docker compose --profile test run --rm -e SMOKE_USERNAME -e SMOKE_PASSWORD test python scripts/smoke_test.py
      - name: Publish verified private MinIO image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: minio-image-linux-amd64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/minio-image/minio-image.tar.gz
            ${{ runner.temp }}/minio-image/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Service diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100 api worker dispatcher migrate storage-init
      - name: Stop disposable stack
        if: always()
        run: docker compose down
