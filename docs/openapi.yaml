components:
  schemas:
    Audit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        document_id:
          type: string
          format: uuid
          readOnly: true
        owner_id:
          type: integer
          nullable: true
          readOnly: true
        actor_id:
          type: integer
          nullable: true
          readOnly: true
        actor_kind:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        request_id:
          type: string
          format: uuid
          readOnly: true
        details:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor_id
      - actor_kind
      - created_at
      - details
      - document_id
      - id
      - owner_id
      - request_id
    CreateUserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: user
      required:
      - password
      - username
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        owner_id:
          type: integer
          readOnly: true
        filename:
          type: string
          readOnly: true
        mime_type:
          type: string
          readOnly: true
        size:
          type: integer
          readOnly: true
        sha256:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        document_type:
          type: string
          readOnly: true
        tags:
          type: array
          items:
            type: string
            maxLength: 64
          maxItems: 32
          readOnly: true
        metadata:
          type: object
          additionalProperties: {}
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        revision:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        attempts:
          type: integer
          readOnly: true
        processed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        error_code:
          type: string
          readOnly: true
        error_message:
          type: string
          readOnly: true
        processing_info:
          type: object
          additionalProperties: {}
          readOnly: true
      required:
      - attempts
      - created_at
      - description
      - document_type
      - error_code
      - error_message
      - filename
      - id
      - metadata
      - mime_type
      - owner_id
      - processed_at
      - processing_info
      - revision
      - sha256
      - size
      - status
      - tags
      - title
      - updated_at
    DocumentList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        filename:
          type: string
          readOnly: true
        mime_type:
          type: string
          readOnly: true
        size:
          type: integer
          readOnly: true
        document_type:
          type: string
          readOnly: true
        tags:
          type: array
          items:
            type: string
            maxLength: 64
          maxItems: 32
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        revision:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - document_type
      - filename
      - id
      - mime_type
      - revision
      - size
      - status
      - tags
      - title
      - updated_at
    Health:
      type: object
      properties:
        status:
          type: string
        checks:
          type: object
          additionalProperties: {}
      required:
      - status
    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        document_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/StateEnum'
          readOnly: true
        attempts:
          type: integer
          readOnly: true
        max_attempts:
          type: integer
          readOnly: true
        available_at:
          type: string
          format: date-time
          readOnly: true
        lease_until:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        request_id:
          type: string
          format: uuid
          readOnly: true
        error_code:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attempts
      - available_at
      - created_at
      - document_id
      - error_code
      - id
      - kind
      - lease_until
      - max_attempts
      - request_id
      - state
      - updated_at
    KindEnum:
      enum:
      - ocr
      - delete_object
      type: string
      description: |-
        * `ocr` - Ocr
        * `delete_object` - Delete
    OCRText:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        text:
          type: string
      required:
      - id
      - status
      - text
    PaginatedAuditList:
