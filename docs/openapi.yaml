    PatchedMetadataRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          default: ''
          maxLength: 10000
        document_type:
          type: string
          default: ''
          maxLength: 64
        tags:
          type: array
          items:
            type: string
            maxLength: 64
          maxItems: 32
        metadata:
          type: object
          additionalProperties: {}
    ProcessingStatus:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        attempts:
          type: integer
          readOnly: true
        error_code:
          type: string
          readOnly: true
        error_message:
          type: string
          readOnly: true
        processed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        processing_info:
          type: object
          additionalProperties: {}
          readOnly: true
      required:
      - attempts
      - error_code
      - error_message
      - id
      - processed_at
      - processing_info
      - status
    RoleEnum:
      enum:
      - user
      - admin
      type: string
      description: |-
        * `user` - user
        * `admin` - admin
    StateEnum:
      enum:
      - pending
      - running
      - succeeded
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `running` - Running
        * `succeeded` - Succeeded
        * `failed` - Failed
    StatusEnum:
      enum:
      - pending
      - processing
      - succeeded
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `processing` - Processing
        * `succeeded` - Succeeded
        * `failed` - Failed
    TokenBlacklistRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    UploadRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          default: ''
          maxLength: 10000
        document_type:
          type: string
          default: ''
          maxLength: 64
        tags:
          type: string
          description: JSON array encoded as a multipart text field.
          example: '["test","invoice"]'
        metadata:
          type: string
          description: JSON object encoded as a multipart text field.
          example: '{"department":"finance","year":2026}'
        file:
          type: string
          format: binary
          writeOnly: true
      required:
      - file
      - title
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        role:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - id
      - is_active
      - role
      - username
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - details
          - request_id
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            request_id:
              type: string
              format: uuid
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
