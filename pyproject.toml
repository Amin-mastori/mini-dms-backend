[project]
name = "mini-dms-backend"
version = "1.0.0"
description = "Private documents, asynchronous extraction, and recoverable background jobs."
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django==5.2.17",
  "djangorestframework==3.16.1",
  "celery[redis]==5.6.3",
  "psycopg[binary]==3.3.5",
  "django-storages[s3]==1.14.6",
  "djangorestframework-simplejwt==5.5.1",
  "drf-spectacular==0.29.0",
  "Pillow==12.3.0",
  "pypdfium2==5.13.0",
  "gunicorn==25.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-django==4.14.0", "pytest-cov==7.1.0", "ruff==0.16.6", "requests==2.34.2", "reportlab==4.5.1", "PyYAML==6.0.3"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestWarning"]
markers = ["postgres: requires real PostgreSQL", "ocr: invokes the real OCR engine"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"config/settings/test.py" = ["F403", "F405"]
"**/migrations/*.py" = ["E501"]

[tool.coverage.run]
source = ["accounts", "core", "documents"]
omit = ["*/migrations/*", "*/management/commands/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
